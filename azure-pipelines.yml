pool:
  name: DEV

variables:
  version.MajorMinor: '1.6.0' # Manually adjust the version number as needed. Patch is auto-incremented.
  version.Patch: $[counter(variables['version.MajorMinor'], 0)]
  versionNumber: '$(version.MajorMinor).$(VersionBuild)' 
  # Android Variables
  sdkPath: 'C:\Users\Public\Documents\Embarcadero\Studio\23.0\CatalogRepository\AndroidSDK-3301-22.0.44500.8973'
  ndkPath: 'C:\Users\Public\Documents\Embarcadero\Studio\23.0\CatalogRepository\AndroidNDK-21-23.0.50491.5718\android-ndk-r21'
  javaHome: 'C:\Program Files\Eclipse Adoptium\jdk-11.0.15.10-hotspot\bin'     # Update to the correct path

steps:

- task: PowerShell@2
  displayName: Set the name of the build (i.e. the Build.BuildNumber)
  inputs:
    targetType: 'inline'
    script: |
      [string] $buildName = "$(versionNumber)"
      [string] $buildbranch = "$(Build.SourceBranchName)"
      Write-Host "Setting the name of the build to '$buildName'."
      Write-Host "##vso[build.updatebuildnumber]$buildbranch-$buildName"
# Android Step      
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '6.x'  # Adjust to your .NET version if applicable      
- task: CmdLine@1
  displayName: Init submodules
  inputs:
   filename: 'C:\Program Files\Git\cmd\git.exe'
   arguments: 'submodule init'
- task: CmdLine@1
  displayName: Update submodules
  inputs:
   filename: 'C:\Program Files\Git\cmd\git.exe'
   arguments: 'submodule update'
- task: BatchScript@1
  displayName: 'Delphivariablen für Build vorbereiten'
  inputs:
    filename: PrepareBuild.cmd
    modifyEnvironment: true
- task: MSBuild@1
  displayName: 'Erzeuge Version 32-Bit Exe'
  inputs:
    solution: PCMManagerAPP.dproj
    platform: Win32
    msbuildArguments: '/t:Clean;Build /p:config=Release /p:platform=Win32'
- task: MSBuild@1
  displayName: 'Erzeuge Version 64-Bit Exe'
  inputs:
    solution: PCMManagerAPP.dproj
    msbuildArchitecture: x64
    platform: Win64
    msbuildArguments: '/t:Clean;Build /p:config=Release /p:platform=Win64'
# Android
- task: CmdLine@2
  displayName: 'Install Delphi dependencies'
  inputs:
    script: |
      echo "Setting up Android SDK and NDK"
      set ANDROID_HOME=$(sdkPath)
      set NDK_HOME=$(ndkPath)
      set JAVA_HOME=$(javaHome)
      echo "Dependencies set up successfully"

- task: CmdLine@2
  displayName: 'Build APK 32-Bit'
  inputs:
    script: |
      set ANDROID_HOME=$(sdkPath)
      set NDK_HOME=$(ndkPath)
      set JAVA_HOME=$(javaHome)
      cd $(Build.SourcesDirectory)
      msbuild.exe PCMManagerAPP.dproj /p:config=Debug /p:Platform=Android /t:Clean;Make;Deploy /p:OutputPath=$(Build.ArtifactStagingDirectory)'
- task: CmdLine@2
  displayName: 'Build APK 64-Bit'
  inputs:
    script: |
      set ANDROID_HOME=$(sdkPath)
      set NDK_HOME=$(ndkPath)
      set JAVA_HOME=$(javaHome)
      cd $(Build.SourcesDirectory)
      msbuild.exe PCMManagerAPP.dproj /p:config=Debug /p:Platform=Android64 /t:Clean;Make;Deploy /p:OutputPath=$(Build.ArtifactStagingDirectory)'      
- task: BatchScript@1
  displayName: erzeugte Versionen ins Setupverzeichnis kopieren 
  inputs:
    filename: PrepareCopy.cmd
    modifyEnvironment: true
- task: mspremier.PostBuildCleanup.PostBuildCleanup-task.PostBuildCleanup@3
  displayName: 'CleanUp Agent Directories'
- task: gitsync@1
  displayName: 'Synchronsiere mit GitHub'
  inputs:
    GitRepoUrl: 'https://github.com/JtheK1984/PCMAppRest.git'
- task: BatchScript@1
  displayName: Cleanup Buildverzeichnis
  inputs:
    filename: E:\PrepareCleanup.cmd